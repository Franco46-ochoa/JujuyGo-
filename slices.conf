# Configuración de ./slices. Es bash: se lee con `source`.
BASE="master"                # rama a la que se mergea cada slice
LANZADOR="orca"              # workers supervisados por Orca
AGENTE_ORCA="copilot"        # worker principal: Copilot CLI (verificado E2E 2026-11-05).
                             # gemini: OAuth individual muerto (Google migró a Antigravity);
                             # agy: existe la cuenta nativa en Orca pero falta alias de agente.
MODELO=""                    # vacío = el default del agente

# Ejecutor local (LANZADOR=local) y tareas mínimas: Kimi CLI ya instalado.
# Para correr un slice local con Kimi: SLICES_LANZADOR=local ./slices lanzar <id>
EJECUTOR="cmd"
EJECUTOR_CMD='"/c/Users/Elect/.kimi-code/bin/kimi.exe" -p "$SLICES_PROMPT"'  # -y/--auto chocan con -p; -p solo ya corre autónomo

JUEZ=""                      # verificado 2026-11-05: claude no conecta a la API → sin juez LLM;
                             # el gate es checks + code-review-en-loop de Devin antes de mergear.
                             # Reponer JUEZ="claude" (MODELO_JUEZ="haiku") o JUEZ="jev" cuando haya un LLM disponible.

MODO="auto"                  # mergea solo si cierra verde
MAX_PARALELO=2               # una sola cuota Google (Devin no cuenta: no la gasta)
MAX_INTENTOS=3

# Dependencias en cada worktree nuevo (cwd = worktree).
PREPARAR='for d in frontend backend; do [ -d "$d" ] && (cd "$d" && npm ci); done; true'

# Cuando exista backend/ + credenciales Postgres en .env: una DB por worktree.
# Descomentar y adaptar (ver docs/agents/orquestacion.md):
#   WT="$(basename "$PWD")"
#   createdb "jujuygo_test_$WT" && (cd backend && npm run migrate)
#   sed -i "s#/jujuygo[^\"']*#/jujuygo_test_$WT#" backend/.env

# Lo que tiene que pasar para que un slice cierre. "nombre::comando".
# Se saltan las carpetas que aún no existen (repo vacío); cuando aparezcan, exigen npm test.
CHECKS=(
  "tests::test ! -f package.json || npm test"
  "tests-front::test ! -d frontend || (cd frontend && npm test -- --watch=false)"
  "tests-back::test ! -d backend || (cd backend && npm test)"
)
