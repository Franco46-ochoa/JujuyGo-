<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JujuyGo — Travesía v2 · mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Archivo:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27%23B5492A%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="yapa.css">
<link rel="stylesheet" href="travesia-v2.css">
</head>
<body>

<header class="v2-head">
  <a class="brand" href="index.html">JujuyGo<span></span></a>
  <p class="v2-sub" id="v2-sub">Travesía</p>
  <details class="v2-datos">
    <summary>Sobre estos datos</summary>
    <div class="v2-datos-body" id="v2-datos-body"></div>
  </details>
</header>

<div class="v2-mapa-wrap">
  <div id="mapa" role="application" aria-label="Mapa de la travesía. La lista contiene la misma información."></div>
</div>

<aside id="panel" class="v2-panel" data-estado="contraida" aria-expanded="false" aria-label="Panel del viaje">
  <div class="hoja-cab" id="hoja-cab">
    <button type="button" class="hoja-asa" id="hoja-asa" aria-label="Cambiar tamaño del panel"><span aria-hidden="true"></span></button>
    <div id="cab-dias" class="v2-dias"></div>
    <div class="hoja-acciones">
      <button type="button" id="btn-subir" aria-label="Subir panel">▴</button>
      <button type="button" id="btn-bajar" aria-label="Bajar panel">▾</button>
    </div>
  </div>
  <div class="hoja-contenido" id="panel-contenido">
    <nav class="v2-nav" id="v2-nav" aria-label="Días de la travesía"></nav>
    <p class="v2-resumen" id="v2-resumen"></p>
    <div id="lista"></div>
    <div id="detalle" class="v2-detalle" hidden></div>
  </div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="travesia-v2.js"></script>
</body>
</html>
